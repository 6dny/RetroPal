name: Deploy RetroPal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble RetroPal Pages site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist

          mkdir -p \
            dist/vendor/emulatorjs/cores/reports \
            dist/vendor/emulatorjs/compression \
            dist/demo

          cp index.html player.html \
            app.js player.js player.css \
            styles.css theme.css systems.js storage.js icons.js \
            favicon.svg dist/

          cp input-lab.nes dist/demo/

          cp LICENSE THIRD_PARTY_NOTICES.md dist/

          cp loader.js \
            emulator.min.js \
            emulator.min.css \
            version.json \
            dist/vendor/emulatorjs/

          cp extract7z.js \
            extractzip.js \
            libunrar.js \
            libunrar.wasm \
            dist/vendor/emulatorjs/compression/

          cp *-wasm.data dist/vendor/emulatorjs/cores/

          cp a5200.json \
            fceumm.json \
            gambatte.json \
            genesis_plus_gx.json \
            melonds.json \
            mgba.json \
            mupen64plus_next.json \
            pcsx_rearmed.json \
            prosystem.json \
            smsplus.json \
            snes9x.json \
            stella2014.json \
            dist/vendor/emulatorjs/cores/reports/

          touch dist/.nojekyll

          test -s dist/index.html
          test -s dist/player.html
          test -s dist/vendor/emulatorjs/loader.js
          test -s dist/vendor/emulatorjs/emulator.min.js
          test -s dist/vendor/emulatorjs/cores/fceumm-wasm.data
          test -s dist/vendor/emulatorjs/cores/reports/fceumm.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
